server:
  port: 8080

spring:
  application:
    name: iot-agent-dashboard-api

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/master

dashboard:
  device-api-base-url: ${DEVICE_API_BASE_URL:http://iot-agent-device-api:8080}
  stream-worker-base-url: ${STREAM_WORKER_BASE_URL:http://iot-agent-stream-worker:8080}
  alert-api-base-url: ${ALERT_API_BASE_URL:http://iot-agent-alert-api:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always